      demo: "Примеры данных: компании и результаты ниже придуманы, чтобы показать работу страницы. Агент заменяет их снимком одного реального профиля.",
      quota_h: "Месячный лимит", year: "Год", month: "Месяц", sort: "Сортировка", search: "Поиск", search_ph: "Компания, город или должность",
      result: "Результат", all_years: "Все годы", all_months: "Все месяцы", expand: "Развернуть всё", collapse: "Свернуть всё", reset: "Сбросить", top: "Наверх", theme: "Переключить светлую / тёмную тему",
      s_date_desc: "Дата: сначала новые", s_date_asc: "Дата: сначала старые", s_res_good: "Результат: сначала успешные", s_res_bad: "Результат: сначала неуспешные",
      r_all: "Все", r_positive: "Успешно", r_rejected: "Неуспешно", r_pending: "Ожидание", r_needs_user: "Нужно ваше решение", r_delivery_error: "Ошибка доставки",
      k_sent: "Отправлено", k_reply: "Ответ", k_bounce: "Не доставлено",
      c_sent: "Отправлено", c_replies: "Ответов", c_resp_apps: "Заявок с ответом", c_pos: "Успешно", c_rej: "Неуспешно", c_wait: "Ожидание", c_err: "Ошибок доставки", c_old: "Ответов на прошлые месяцы",
      q_used: "Использовано", q_reserved: "Зарезервировано", q_left: "Осталось",
      th_time: "Время", th_event: "Событие", th_company: "Компания", th_role: "Должность", th_channel: "Канал", th_result: "Результат", th_note: "Заметка", th_orig: "Отправлено",
      day_sent: "отправлено", day_replies: "ответов", day_errors: "не доставлено",
      none: "Ничего не подходит под текущие фильтры.", showing: "Показано {a} из {b} записей", entries: "записей",
      gen: "Снимок", mail: "Почта проверена", tz: "Часовой пояс", profile: "Профиль", fresh: "Актуально", stale: "Возможно устарело: снимку {h} ч", sample: "Пример снимка",
      help_h: "Как считаются числа",
      h1: "Месяц считает заявки по дню фактической отправки, а ответы — по дню получения, даже если ответ относится к заявке прошлого месяца.",
      h2: "«Успешно» — положительный ответ (например, приглашение). «Неуспешно» — отказ. «Ожидание» — содержательного ответа ещё нет. «Нужно ваше решение» — приглашение, вопрос или просьба о документах: на них агент сам не отвечает.",
      h3: "Ошибка доставки показана отдельно: это не отказ работодателя. Отправленная заявка, которая потом не дошла, всё равно заняла один слот месячного лимита.",
      h4: "Три ответа на одну заявку — это три события-ответа, но одна заявка с ответом. Автоответы и уведомления о доставке ответами не считаются.",
      h5: "Лимит общий для всех профилей одного человека. «Зарезервировано» — запланированные, но ещё не отправленные слоты.",
      license: "Шаблон страницы статистики · код: PolyForm Noncommercial 1.0.0 · без сетевых запросов, эта страница ничего не сохраняет и не отправляет.",
      nav_overview: "Обзор", nav_install: "Установка", nav_profile: "Профиль", nav_arch: "Архитектура", nav_safety: "Безопасность", nav_market: "Рынок", nav_roadmap: "План работ", nav_stats: "Статистика"
    }
  };

  /* ---------- State ---------- */
  var params = new URLSearchParams(location.search);
  var lang = params.get("lang") === "ru" || params.get("lang") === "en" ? params.get("lang") : (DATA.default_language === "ru" ? "ru" : "en");
  var tz = DATA.timezone || "UTC";
  var state = { year: "all", month: "all", sort: "date_desc", result: "all", q: "" };
  var RANK = { positive: 0, needs_user: 1, pending: 2, rejected: 3, delivery_error: 4 };
  var BADGE = { positive: "ok", rejected: "bad", pending: "wait", needs_user: "warn", delivery_error: "err" };

  function t(k) { return T[lang][k] || T.en[k] || k; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* ---------- Dates (grouping uses the snapshot time zone; sorting uses real timestamps) ---------- */
  var fmtParts = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  function parts(iso) {
    var o = {}; fmtParts.formatToParts(new Date(iso)).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, hh: o.hour, mm: o.minute, key: o.year + "-" + o.month + "-" + o.day, mkey: o.year + "-" + o.month, ts: Date.parse(iso) };
  }
  function dayLabel(key) { var a = key.split("-"); return new Intl.DateTimeFormat(lang === "ru" ? "ru-RU" : "en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]))); }
  function monthLabel(mkey) { var a = mkey.split("-"); var s = new Intl.DateTimeFormat(lang === "ru" ? "ru-RU" : "en-GB", { timeZone: "UTC", month: "long", year: "numeric" }).format(new Date(Date.UTC(+a[0], +a[1] - 1, 15))); return s.charAt(0).toUpperCase() + s.slice(1); }
  function stamp(iso) { return new Intl.DateTimeFormat(lang === "ru" ? "ru-RU" : "en-GB", { timeZone: tz, dateStyle: "medium", timeStyle: "short" }).format(new Date(iso)); }

  /* ---------- Build entries ---------- */
  var apps = {}; (DATA.applications || []).forEach(function (a) { apps[a.id] = a; });
  var entries = [];
  (DATA.applications || []).forEach(function (a) {
    var p = parts(a.sent_at);
    entries.push({ id: "s:" + a.id, kind: "sent", p: p, app: a, result: a.outcome === "no_response" ? "pending" : a.outcome, note: a.note || "" });
    if (a.bounce_at) entries.push({ id: "b:" + a.id, kind: "bounce", p: parts(a.bounce_at), app: a, result: "delivery_error", note: a.bounce_note || "" });
  });
  (DATA.responses || []).forEach(function (r) {
    var a = apps[r.application_id]; if (!a) return;
    entries.push({ id: "r:" + r.id, kind: "reply", p: parts(r.received_at), app: a, result: r.kind, note: r.note || "", sentp: parts(a.sent_at) });
  });

  /* ---------- Statistics (definitions follow DATA_CONTRACT §8) ---------- */
  function statsFor(list) {
    var s = { sent: 0, replies: 0, respApps: {}, pos: {}, rej: {}, wait: 0, err: {}, old: 0 };
    list.forEach(function (e) {
      if (e.kind === "sent") { s.sent++; if (e.app.outcome === "no_response") s.wait++; }
      else if (e.kind === "reply") {
        s.replies++; s.respApps[e.app.id] = 1;
        if (e.sentp && e.sentp.mkey !== e.p.mkey) s.old++;
        if (e.app.outcome === "positive") s.pos[e.app.id] = 1; else if (e.app.outcome === "rejected") s.rej[e.app.id] = 1;
      } else if (e.kind === "bounce") s.err[e.app.id] = 1;
    });
    return { sent: s.sent, replies: s.replies, respApps: Object.keys(s.respApps).length, pos: Object.keys(s.pos).length, rej: Object.keys(s.rej).length, wait: s.wait, err: Object.keys(s.err).length, old: s.old };
  }
  var limit = (DATA.quota && DATA.quota.limit) || 44;
  var reservedBy = (DATA.quota && DATA.quota.reserved) || {};
  var usedOverride = (DATA.quota && DATA.quota.used) || {};
  function usedIn(mkey) { if (usedOverride[mkey] !== undefined) return usedOverride[mkey]; return entries.filter(function (e) { return e.kind === "sent" && e.p.mkey === mkey; }).length; }
  var nowKey = parts(DATA.generated_at).mkey;

  /* ---------- Controls ---------- */
  var selYear = document.getElementById("f-year"), selMonth = document.getElementById("f-month"), selSort = document.getElementById("f-sort"),
      inpQ = document.getElementById("f-search"), chipBox = document.getElementById("f-result");
  var years = [], monthsByYear = {};
  entries.forEach(function (e) { if (years.indexOf(e.p.y) < 0) years.push(e.p.y); (monthsByYear[e.p.y] = monthsByYear[e.p.y] || {})[e.p.mkey] = 1; });
  years.sort(function (a, b) { return b - a; });

  function fillSelect(sel, items, current) {
    sel.textContent = "";
    items.forEach(function (it) { var o = el("option", "", it[1]); o.value = it[0]; if (it[0] === current) o.selected = true; sel.appendChild(o); });
  }
  function fillMonths() {
    var items = [["all", t("all_months")]];
    var ys = state.year === "all" ? years : [+state.year];
    var keys = []; ys.forEach(function (y) { Object.keys(monthsByYear[y] || {}).forEach(function (k) { keys.push(k); }); }); keys.sort().reverse();
    keys.forEach(function (k) { items.push([k, monthLabel(k)]); });
    if (state.month !== "all" && keys.indexOf(state.month) < 0) state.month = "all";
    fillSelect(selMonth, items, state.month);
  }
  function fillControls() {
    fillSelect(selYear, [["all", t("all_years")]].concat(years.map(function (y) { return [String(y), String(y)]; })), state.year);
    fillMonths();
    fillSelect(selSort, [["date_desc", t("s_date_desc")], ["date_asc", t("s_date_asc")], ["res_good", t("s_res_good")], ["res_bad", t("s_res_bad")]], state.sort);
    chipBox.textContent = "";
    var counts = { all: entries.length };
    entries.forEach(function (e) { counts[e.result] = (counts[e.result] || 0) + 1; });
    ["all", "positive", "rejected", "pending", "needs_user", "delivery_error"].forEach(function (k) {
      var b = el("button", "chip", t("r_" + k)); b.type = "button"; b.setAttribute("aria-pressed", state.result === k ? "true" : "false"); b.dataset.r = k;
      b.appendChild(el("span", "n", String(counts[k] || 0))); chipBox.appendChild(b);
    });
    inpQ.value = state.q;
  }

  /* ---------- Rendering ---------- */
  function badge(result) { return el("span", "badge " + (BADGE[result] || ""), t("r_" + result)); }
  function tile(cls, value, label) { var d = el("div", "tile " + cls); d.appendChild(el("b", "", String(value))); d.appendChild(el("span", "", label)); return d; }
  function mstat(value, label) { var d = el("div"); d.appendChild(el("b", "", String(value))); d.appendChild(el("span", "", label)); return d; }

  function visible() {
    var q = state.q.trim().toLowerCase();
    return entries.filter(function (e) {
      if (state.year !== "all" && String(e.p.y) !== state.year) return false;
      if (state.month !== "all" && e.p.mkey !== state.month) return false;
      if (state.result !== "all" && e.result !== state.result) return false;
      if (q && (e.app.company + " " + e.app.city + " " + e.app.role).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function rowCmp(sort) {
    return function (a, b) {
      if (sort === "res_good" || sort === "res_bad") {
        var d = (RANK[a.result] - RANK[b.result]) * (sort === "res_good" ? 1 : -1); if (d) return d;
      }
      if (sort === "date_asc") return a.p.ts - b.p.ts;
      return b.p.ts - a.p.ts;
    };
  }
  function group(list) {
    var Y = {};
    list.forEach(function (e) { var y = (Y[e.p.y] = Y[e.p.y] || {}); var m = (y[e.p.mkey] = y[e.p.mkey] || {}); (m[e.p.key] = m[e.p.key] || []).push(e); });
    return Y;
  }

  function render() {
    var out = document.getElementById("out"); out.textContent = "";
    var list = visible();
    document.getElementById("count").textContent = t("showing").replace("{a}", list.length).replace("{b}", entries.length);
    if (!list.length) { out.appendChild(el("div", "empty", t("none"))); return; }
    var asc = state.sort === "date_asc";
    var Y = group(list);
    var ykeys = Object.keys(Y).map(Number).sort(function (a, b) { return asc ? a - b : b - a; });
    var first = true;
    ykeys.forEach(function (y) {
      var yd = el("details", "year"); yd.open = true;
      var ys = el("summary"); ys.appendChild(el("h2", "", String(y)));
      var yst = statsFor(entries.filter(function (e) { return e.p.y === y; }));
      ys.appendChild(el("span", "sum", yst.sent + " " + t("day_sent") + " · " + yst.replies + " " + t("day_replies") + " · " + yst.pos + " " + t("c_pos").toLowerCase()));
      yd.appendChild(ys);
      var mkeys = Object.keys(Y[y]).sort(); if (!asc) mkeys.reverse();
      mkeys.forEach(function (mk) {
        var md = el("details", "month"); md.open = first; first = false; md.dataset.mk = mk;
        var ms = el("summary"); ms.appendChild(el("h3", "", monthLabel(mk)));
        var all = entries.filter(function (e) { return e.p.mkey === mk; }); var st = statsFor(all);
        var used = usedIn(mk), res = reservedBy[mk] || 0;
        ms.appendChild(el("span", "sum", st.sent + " " + t("day_sent") + " · " + st.replies + " " + t("day_replies") + " · " + t("q_used").toLowerCase() + " " + used + "/" + limit));
        md.appendChild(ms);
        var stats = el("div", "mstats");
        stats.appendChild(mstat(st.sent, t("c_sent"))); stats.appendChild(mstat(st.replies, t("c_replies"))); stats.appendChild(mstat(st.respApps, t("c_resp_apps")));
        stats.appendChild(mstat(st.pos, t("c_pos"))); stats.appendChild(mstat(st.rej, t("c_rej"))); stats.appendChild(mstat(st.wait, t("c_wait")));
        stats.appendChild(mstat(st.err, t("c_err"))); stats.appendChild(mstat(st.old, t("c_old")));
        stats.appendChild(mstat(used + " / " + res + " / " + Math.max(0, limit - used - res), t("q_used") + " / " + t("q_reserved") + " / " + t("q_left")));
        md.appendChild(stats);
        var dkeys = Object.keys(Y[y][mk]).sort(); if (!asc) dkeys.reverse();
        dkeys.forEach(function (dk) {
          var rows = Y[y][mk][dk].slice().sort(rowCmp(state.sort));
          var day = el("div", "day"); var h = el("h4", "", dayLabel(dk));
          var ds = statsFor(rows); var bits = [];
          if (ds.sent) bits.push(ds.sent + " " + t("day_sent")); if (ds.replies) bits.push(ds.replies + " " + t("day_replies")); if (ds.err) bits.push(ds.err + " " + t("day_errors"));
          h.appendChild(el("small", "", bits.join(" · "))); day.appendChild(h);
          var wrap = el("div", "tscroll"), tb = el("table"), th = el("thead"), hr = el("tr");
          ["th_time", "th_event", "th_company", "th_role", "th_channel", "th_result", "th_note"].forEach(function (k) { var c = el("th", "", t(k)); c.scope = "col"; hr.appendChild(c); });
          th.appendChild(hr); tb.appendChild(th); var body = el("tbody");
          rows.forEach(function (e) {
            var tr = el("tr");
            tr.appendChild(el("td", "time", e.p.hh + ":" + e.p.mm));
            var kd = el("td"); kd.appendChild(el("span", "kind " + e.kind, t("k_" + e.kind))); tr.appendChild(kd);
            var cd = el("td"); cd.appendChild(el("span", "co", e.app.company)); cd.appendChild(el("span", "sub", e.app.city)); tr.appendChild(cd);
            tr.appendChild(el("td", "", e.app.role)); tr.appendChild(el("td", "", e.app.channel));
            var rd = el("td"); rd.appendChild(badge(e.result)); tr.appendChild(rd);
            var note = e.note; if (e.kind === "reply" && e.sentp) note = (note ? note + " · " : "") + t("th_orig") + " " + dayLabel(e.sentp.key);
            tr.appendChild(el("td", "", note)); body.appendChild(tr);
          });
          tb.appendChild(body); wrap.appendChild(tb); day.appendChild(wrap); md.appendChild(day);
        });
        yd.appendChild(md);
      });
      out.appendChild(yd);
    });
  }

  /* ---------- Static texts ---------- */
  function applyTexts() {
    document.documentElement.lang = lang;
    document.title = "HomenS.AI JobPilot | " + t("eyebrow");
    document.querySelectorAll("[data-i]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i")); });
    document.querySelectorAll("[data-i-ph]").forEach(function (n) { n.placeholder = t(n.getAttribute("data-i-ph")); });
    document.querySelectorAll("[data-i-label]").forEach(function (n) { var s = t(n.getAttribute("data-i-label")); n.setAttribute("aria-label", s); n.title = s; });
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
    var help = document.getElementById("help-list"); help.textContent = "";
    ["h1", "h2", "h3", "h4", "h5"].forEach(function (k) { help.appendChild(el("li", "", t(k))); });
    // meta pills
    var meta = document.getElementById("meta"); meta.textContent = "";
    if (DATA.profile_id) meta.appendChild(el("span", "pill", t("profile") + ": " + DATA.profile_id));
    meta.appendChild(el("span", "pill", t("tz") + ": " + tz));
    meta.appendChild(el("span", "pill", t("gen") + ": " + stamp(DATA.generated_at)));
    if (DATA.last_mail_check_at) meta.appendChild(el("span", "pill", t("mail") + ": " + stamp(DATA.last_mail_check_at)));
    var age = Math.round((Date.now() - Date.parse(DATA.generated_at)) / 36e5);
    if (DATA.demo) meta.appendChild(el("span", "pill info", t("sample")));
    else if (age > 72) meta.appendChild(el("span", "pill warn", t("stale").replace("{h}", age)));
    else meta.appendChild(el("span", "pill ok", t("fresh")));
    document.getElementById("demo-note").hidden = !DATA.demo;
    // quota of the snapshot month
    var used = usedIn(nowKey), res = reservedBy[nowKey] || 0, left = Math.max(0, limit - used - res);
    var bar = document.getElementById("quota-bar"); bar.children[0].style.width = (used / limit * 100) + "%"; bar.children[1].style.width = (res / limit * 100) + "%";
    var txt = monthLabel(nowKey) + " — " + t("q_used") + ": " + used + " · " + t("q_reserved") + ": " + res + " · " + t("q_left") + ": " + left + " (" + limit + ")";
    document.getElementById("quota-text").textContent = txt; bar.setAttribute("aria-label", txt);
    // project navigation, only for the sample inside the repository
    var nav = document.getElementById("demo-nav");
    if (DATA.demo) {
      var pre = lang === "ru" ? "../docs/ru/" : "../";
      var items = [["overview", "PROJECT_OVERVIEW.html", ""], ["install", "overview_install.html", "teal"], ["profile", "overview_profile.html", "gold"], ["arch", "overview_architecture.html", ""], ["safety", "overview_safety.html", "teal"], ["market", "overview_market.html", "gold"], ["roadmap", "overview_roadmap.html", ""]];
      nav.textContent = "";
      items.forEach(function (it) { var a = el("a", "nav-link"); a.href = pre + it[1]; var d = el("i", "dot " + it[2]); d.setAttribute("aria-hidden", "true"); a.appendChild(d); a.appendChild(document.createTextNode(t("nav_" + it[0]))); nav.appendChild(a); });
      var cur = el("a", "nav-link"); cur.href = "#"; cur.setAttribute("aria-current", "page"); var d2 = el("i", "dot teal"); d2.setAttribute("aria-hidden", "true"); cur.appendChild(d2); cur.appendChild(document.createTextNode(t("nav_stats"))); nav.appendChild(cur);
      nav.hidden = false;
      document.getElementById("brand").href = pre + "PROJECT_OVERVIEW.html";
    } else { nav.hidden = true; document.getElementById("brand").removeAttribute("href"); }
    fillControls(); render();
  }

  /* ---------- Events ---------- */
  selYear.addEventListener("change", function () { state.year = selYear.value; fillMonths(); render(); });
  selMonth.addEventListener("change", function () { state.month = selMonth.value; render(); });
  selSort.addEventListener("change", function () { state.sort = selSort.value; render(); });
  inpQ.addEventListener("input", function () { state.q = inpQ.value; render(); });
  chipBox.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-r]"); if (!b) return; state.result = b.dataset.r;
    chipBox.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); render();
  });
  document.getElementById("expand").addEventListener("click", function () { document.querySelectorAll("#out details").forEach(function (d) { d.open = true; }); });
  document.getElementById("collapse").addEventListener("click", function () { document.querySelectorAll("#out details.month").forEach(function (d) { d.open = false; }); });
  document.getElementById("reset").addEventListener("click", function () { state = { year: "all", month: "all", sort: "date_desc", result: "all", q: "" }; fillControls(); render(); });
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang; applyTexts();
      try { var u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); } catch (e) { /* file URL: ignore */ }
    });
  });
  document.getElementById("theme-btn").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark"; root.setAttribute("data-theme", next);
    try { localStorage.setItem("homensai.theme", next); } catch (e) { /* optional */ }
  });
  var top = document.getElementById("to-top");
  function onScroll() { top.hidden = (window.pageYOffset || document.documentElement.scrollTop) < 300; }
  top.addEventListener("click", function (e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  applyTexts();
})();
</script>
