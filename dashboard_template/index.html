  function fmtNum(x) { return x.toLocaleString(LOCALE[lang], { maximumFractionDigits: 1 }); }
  function monthLabel(mkey) {
    var p = mkey.split("-");
    var s = new Intl.DateTimeFormat(LOCALE[lang], { timeZone: "UTC", month: "long", year: "numeric" }).format(new Date(Date.UTC(+p[0], +p[1] - 1, 1)));
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dayLabel(key) {
    var p = key.split("-");
    return new Intl.DateTimeFormat(LOCALE[lang], { timeZone: "UTC", weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])));
  }
  function stamp(iso) {
    return new Intl.DateTimeFormat(LOCALE[lang], { timeZone: SRC.timezone, dateStyle: "medium", timeStyle: "short", hourCycle: "h23" }).format(new Date(iso));
  }
  function monthEnd(mkey) { var p = mkey.split("-"); return mkey + "-" + pad(new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate()); }

  // ---- one record = one application with its current status ----
  function dateOf(a) { return a.sent_at || a.status_at || a.planned_at || null; }
  function group(a) { return GROUP[a.status]; }
  function isSent(a) { return group(a) !== "drafts"; }
  var generatedMs = SRC ? Date.parse(SRC.generated_at) : 0;
  function daysWaiting(a) { return a.sent_at ? Math.floor((generatedMs - Date.parse(a.sent_at)) / DAY) : null; }

  var rows = [];
  if (DATA) {
    SRC.applications.forEach(function (a) {
      var when = dateOf(a);
      rows.push({ a: a, when: when, p: when ? parts(when) : null, g: group(a) });
    });
  }
  function inQuota(map, mkey) { return SRC && SRC.quota && isRecord(SRC.quota[map]) && validCount(SRC.quota[map][mkey]) ? SRC.quota[map][mkey] : 0; }
  var limit = SRC && SRC.quota && validCount(SRC.quota.limit) ? SRC.quota.limit : 44;
  var nowKey = SRC ? parts(SRC.generated_at).mkey : "";
  var minutes = {};
  MINUTE_KEYS.forEach(function (k) { minutes[k] = SRC && SRC.minutes_per_application && typeof SRC.minutes_per_application[k] === "number" ? SRC.minutes_per_application[k] : 0; });
  var minutesPerApp = MINUTE_KEYS.reduce(function (s, k) { return s + minutes[k]; }, 0);

  function countWhere(list, fn) { return list.filter(fn).length; }
  function pct(n, base) { return base ? Math.round((n * 100) / base) + "%" : "—"; }

  // ---- rendering ----
  function render() {
    var out = document.getElementById("out"); out.textContent = "";
    if (!DATA) return showError();
    var sentRows = rows.filter(function (r) { return r.g !== "drafts"; });
    var base = sentRows.length;
    var counts = { positive: 0, waiting: 0, rejected: 0, error: 0 };
    sentRows.forEach(function (r) { counts[r.g] = (counts[r.g] || 0) + 1; });

    setText("share-base", base ? t("share_base", { n: base }) : t("share_none"));
    var bar = document.getElementById("share-bar"); bar.textContent = "";
    var legend = document.getElementById("share-legend"); legend.textContent = "";
    [["positive", "share_pos", "s-pos"], ["waiting", "share_wait", "s-wait"], ["rejected", "share_rej", "s-rej"], ["error", "share_err", "s-err"]].forEach(function (x) {
      var n = counts[x[0]];
      if (base && n) { var seg = el("i", x[2]); seg.style.width = (n * 100 / base) + "%"; bar.appendChild(seg); }
      var li = el("li", "");
      li.appendChild(el("i", "key " + x[2]));
      li.appendChild(el("span", "", t(x[1]) + ": " + n + " (" + pct(n, base) + ")"));
      legend.appendChild(li);
    });
    bar.setAttribute("aria-label", base ? [counts.positive, counts.waiting, counts.rejected, counts.error].join(" / ") : t("share_none"));

    var reasons = document.getElementById("reasons"); reasons.textContent = "";
    var rej = { rejected_vacancy_unavailable: 0, rejected_cv_mismatch: 0, rejected_qualification_mismatch: 0, rejected_no_reason: 0 };
    sentRows.forEach(function (r) { if (rej[r.a.status] !== undefined) rej[r.a.status]++; });
    var rejTotal = rej.rejected_vacancy_unavailable + rej.rejected_cv_mismatch + rej.rejected_qualification_mismatch + rej.rejected_no_reason;
    [["rejected_vacancy_unavailable", "r_vacancy"], ["rejected_cv_mismatch", "r_cv"], ["rejected_qualification_mismatch", "r_qual"], ["rejected_no_reason", "r_none"]].forEach(function (x) {
      var n = rej[x[0]];
      var line = el("div", "hbar");
      line.appendChild(el("span", "hbar-l", t(x[1])));
      var track = el("span", "track"); var fill = el("i", "s-rej"); fill.style.width = (rejTotal ? n * 100 / rejTotal : 0) + "%"; track.appendChild(fill);
      line.appendChild(track);
      line.appendChild(el("span", "hbar-v", n + " (" + pct(n, rejTotal) + ")"));
      reasons.appendChild(line);
    });

    setText("quota-text", t("quota_text", { m: monthLabel(nowKey), u: inQuota("used", nowKey), r: inQuota("reserved", nowKey), l: Math.max(0, limit - inQuota("used", nowKey) - inQuota("reserved", nowKey)), limit: limit }));
    var qm = document.getElementById("quota-months"); qm.textContent = "";
    var months = Object.keys((SRC.quota && SRC.quota.used) || {}).sort().reverse();
    months.forEach(function (mk) {
      var u = inQuota("used", mk), rs = inQuota("reserved", mk);
      var line = el("div", "hbar");
      line.appendChild(el("span", "hbar-l", monthLabel(mk)));
      var track = el("span", "track"); var fu = el("i", "s-wait"); fu.style.width = Math.min(100, u * 100 / limit) + "%"; track.appendChild(fu);
      var fr = el("i", "s-res"); fr.style.width = Math.min(100 - Math.min(100, u * 100 / limit), rs * 100 / limit) + "%"; track.appendChild(fr);
      line.appendChild(track);
      line.appendChild(el("span", "hbar-v", t("quota_val", { u: u, r: rs, limit: limit })));
      qm.appendChild(line);
    });

    var hoursAll = base * minutesPerApp / 60;
    setText("hours-total", t("hours_total", { h: fmtNum(hoursAll), n: base }));
    var ul = document.getElementById("assumptions"); ul.textContent = "";
    MINUTE_KEYS.forEach(function (k) { ul.appendChild(el("li", "", t("a_" + k) + ": " + minutes[k] + " " + t("min"))); });
    var hm = document.getElementById("hours-months"); hm.textContent = "";
    var sentMonths = {}; sentRows.forEach(function (r) { if (r.p) sentMonths[r.p.mkey] = (sentMonths[r.p.mkey] || 0) + 1; });
    Object.keys(sentMonths).sort().reverse().forEach(function (mk) {
      hm.appendChild(el("p", "sum", t("hours_month", { m: monthLabel(mk), h: fmtNum(sentMonths[mk] * minutesPerApp / 60) })));
    });

    renderControls();
    renderList();
    document.getElementById("count").textContent = t("count", { a: visibleCount, b: rows.length });
  }
  function setText(id, s) { document.getElementById(id).textContent = s; }

  function showError() {
    var out = document.getElementById("out");
    var box = el("div", "empty"); box.appendChild(el("h2", "", t("error_h"))); box.appendChild(el("p", "", t("error_text", { why: problemText || "summary.js" })));
    out.appendChild(box);
    ["share-base", "quota-text", "hours-total", "count"].forEach(function (id) { setText(id, ""); });
  }

  // ---- filters and sorting ----
  var state = { year: "all", month: "all", group: "all", sort: "new", q: "" };
  var visibleCount = 0;
  function renderControls() {
    var years = {}; rows.forEach(function (r) { if (r.p) years[r.p.y] = 1; });
    var ys = Object.keys(years).sort().reverse();
    fill("f-year", [["all", t("all_years")]].concat(ys.map(function (y) { return [y, y]; })), state.year);
    var ms = {}; rows.forEach(function (r) { if (r.p && (state.year === "all" || String(r.p.y) === state.year)) ms[r.p.mkey] = 1; });
    fill("f-month", [["all", t("all_months")]].concat(Object.keys(ms).sort().reverse().map(function (m) { return [m, monthLabel(m)]; })), state.month);
    fill("f-sort", [["new", t("sort_new")], ["old", t("sort_old")], ["pos", t("sort_pos")], ["rej", t("sort_rej")]], state.sort);
    var box = document.getElementById("f-group"); box.textContent = "";
    ["all"].concat(GROUP_ORDER).forEach(function (g) {
      var n = g === "all" ? rows.length : countWhere(rows, function (r) { return r.g === g; });
      var b = el("button", "chip", t("grp_" + (g === "all" ? "all" : g)));
      b.type = "button"; b.setAttribute("aria-pressed", String(state.group === g));
      b.appendChild(el("span", "n", n));
      b.addEventListener("click", function () { state.group = g; renderControls(); renderList(); });
      box.appendChild(b);
    });
    document.getElementById("f-search").setAttribute("placeholder", t("search_ph"));
  }
  function fill(id, items, current) {
    var sel = document.getElementById(id); sel.textContent = "";
    items.forEach(function (it) { var o = el("option", "", it[1]); o.value = it[0]; if (it[0] === current) o.selected = true; sel.appendChild(o); });
  }
  function matches(r) {
    if (state.group !== "all" && r.g !== state.group) return false;
    if (state.year !== "all" && (!r.p || String(r.p.y) !== state.year)) return false;
    if (state.month !== "all" && (!r.p || r.p.mkey !== state.month)) return false;
    if (state.q) {
      var hay = [r.a.company, r.a.city, r.a.role, r.a.note].filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  var REJ_FIRST = ["rejected", "positive", "waiting", "error", "drafts"];
  function groupOrder() { return state.sort === "rej" ? REJ_FIRST : GROUP_ORDER; }
  function cmp(x, y) {
    var dx = x.when ? x.p.ts : 0, dy = y.when ? y.p.ts : 0;
    if (state.sort === "old") return dx - dy;
    if (state.sort === "new") return dy - dx;
    var gx = groupOrder().indexOf(x.g), gy = groupOrder().indexOf(y.g);
    return gx !== gy ? gx - gy : dy - dx;
  }

  function renderList() {
    var out = document.getElementById("out"); out.textContent = "";
    var list = rows.filter(matches).sort(cmp);
    visibleCount = list.length;
    document.getElementById("count").textContent = t("count", { a: visibleCount, b: rows.length });
    if (!list.length) { out.appendChild(el("div", "empty", t("empty"))); return; }
    var blocks = [];
    if (state.sort === "pos" || state.sort === "rej") {
      groupOrder().forEach(function (g) {
        var part = list.filter(function (r) { return r.g === g; });
        if (part.length) blocks.push({ key: g, items: part });
      });
    } else blocks.push({ key: "all", items: list });
    blocks.forEach(function (b) {
      if (b.key !== "all") out.appendChild(el("h2", "group-h", t("grp_" + b.key)));
      buildTree(out, b.items);
    });
  }
  function buildTree(parent, items) {
    var years = {};
    items.forEach(function (r) {
      var y = r.p ? r.p.y : "—";
      var yb = years[y] = years[y] || { months: {}, undated: [] };
      if (!r.p) { yb.undated.push(r); return; }
      (yb.months[r.p.mkey] = yb.months[r.p.mkey] || []).push(r);
    });
    var yKeys = Object.keys(years).sort(function (a, b) { return (state.sort === "old") ? (a > b ? 1 : -1) : (a < b ? 1 : -1); });
    yKeys.forEach(function (y) {
      var yb = years[y];
      var all = []; Object.keys(yb.months).forEach(function (m) { all = all.concat(yb.months[m]); });
      var det = el("details", "year"); det.open = true;
      var sm = el("summary", ""); sm.appendChild(el("h2", "", y));
      sm.appendChild(el("span", "sum", t("year_sum", { y: y, sent: countWhere(all, function (r) { return r.g !== "drafts"; }), pos: countWhere(all, function (r) { return r.g === "positive"; }), rej: countWhere(all, function (r) { return r.g === "rejected"; }), wait: countWhere(all, function (r) { return r.g === "waiting"; }) })));
      det.appendChild(sm);
      var mKeys = Object.keys(yb.months).sort(function (a, b) { return state.sort === "old" ? (a > b ? 1 : -1) : (a < b ? 1 : -1); });
      mKeys.forEach(function (mk) {
        var ms = yb.months[mk];
        var md = el("details", "month"); md.open = true;
        var msum = el("summary", ""); msum.appendChild(el("h3", "", monthLabel(mk)));
        msum.appendChild(el("span", "sum", t("month_sum", { sent: countWhere(ms, function (r) { return r.g !== "drafts"; }), pos: countWhere(ms, function (r) { return r.g === "positive"; }), rej: countWhere(ms, function (r) { return r.g === "rejected"; }), wait: countWhere(ms, function (r) { return r.g === "waiting"; }) })));
        md.appendChild(msum);
        var days = {}; ms.forEach(function (r) { (days[r.p.key] = days[r.p.key] || []).push(r); });
        var dKeys = Object.keys(days).sort(function (a, b) { return state.sort === "old" ? (a > b ? 1 : -1) : (a < b ? 1 : -1); });
        dKeys.forEach(function (dk) { md.appendChild(dayBlock(dk, days[dk])); });
        det.appendChild(md);
      });
      if (yb.undated.length) {
        var ud = el("div", "day"); ud.appendChild(el("h4", "", t("undated")));
        ud.appendChild(table(yb.undated));
        det.appendChild(ud);
      }
      parent.appendChild(det);
    });
  }
  function dayBlock(dk, list) {
    var d = el("div", "day"); var h = el("h4", ""); h.appendChild(el("span", "", dayLabel(dk))); h.appendChild(el("small", "", list.length)); d.appendChild(h);
    d.appendChild(table(list.slice().sort(function (x, y) { return cmp(x, y); })));
    return d;
  }
  function table(list) {
    var wrap = el("div", "tscroll"); var tb = el("table", "");
    var thead = el("thead", ""); var hr = el("tr", "");
    ["th_time", "th_company", "th_role", "th_channel", "th_status", "th_thanks", "th_note"].forEach(function (k) { hr.appendChild(el("th", "", t(k))); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el("tbody", "");
    list.forEach(function (r) {
      var a = r.a; var tr = el("tr", "");
      tr.appendChild(el("td", "time", r.p ? r.p.hh + ":" + r.p.mi : "—"));
      var cd = el("td", ""); cd.appendChild(el("span", "co", a.company || "—")); cd.appendChild(el("span", "sub", a.city || "—")); tr.appendChild(cd);
      tr.appendChild(el("td", "", a.role || "—"));
      tr.appendChild(el("td", "", a.channel ? t("ch_" + a.channel) : "—"));
      var sd = el("td", ""); var badge = el("span", "badge " + toneOf(r.g), statusLabel(a)); sd.appendChild(badge);
      tr.appendChild(sd);
      var th = "—";
      if (r.g === "rejected" || r.g === "positive") th = a.thank_you_sent_at ? t("thanks_yes") : t("thanks_no");
      tr.appendChild(el("td", "", th));
      tr.appendChild(el("td", "", a.note || ""));
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); return wrap;
  }
  function toneOf(g) { return { positive: "ok", rejected: "bad", waiting: "wait", error: "err", drafts: "" }[g] || ""; }
  function statusLabel(a) {
    if (a.status === "sent_waiting") {
      var d = daysWaiting(a);
      if (d === null) return t("s_waiting_unknown");
      return d === 1 ? t("s_waiting_one") : t("s_waiting_many", { d: d });
    }
    if (a.status === "meeting_invited") return t("s_meeting_invited") + (a.meeting_type ? " — " + t("s_meeting_" + a.meeting_type) : "");
    return t("s_" + a.status);
  }

  // ---- static parts: language, buttons, help ----
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = "HomenS.AI JobPilot | " + t("eyebrow");
    document.querySelectorAll("[data-i]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i")); });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    var help = document.getElementById("help-list"); help.textContent = "";
    ["help1", "help2", "help3", "help4", "help5"].forEach(function (k) { help.appendChild(el("li", "", t(k))); });
    var meta = document.getElementById("meta"); meta.textContent = "";
    if (SRC) {
      meta.appendChild(el("span", "pill info", t("meta_profile") + ": " + (SRC.profile_id || "—")));
      meta.appendChild(el("span", "pill", t("meta_tz") + ": " + SRC.timezone));
      meta.appendChild(el("span", "pill", t("meta_snapshot") + ": " + stamp(SRC.generated_at)));
      var age = Math.floor((Date.now() - generatedMs) / DAY);
      if (age >= 2) meta.appendChild(el("span", "pill warn", t("meta_old", { d: age })));
    }
    var note = document.getElementById("demo-note");
    note.hidden = !(isSample && !cleared);
    var btn = document.getElementById("clear-sample");
    btn.disabled = cleared;
    btn.textContent = cleared ? t("sample_cleared") : t("sample_clear");
  }
  function setLang(next) {
    if (LANGS.indexOf(next) < 0) return;
    lang = next;
    var u = new URL(location.href); u.searchParams.set("lang", lang);
    try { history.replaceState(null, "", u); } catch (e) { /* file address: nothing to update */ }
    applyStatic(); renderFull();
  }
  function renderFull() {
    if (!DATA) { showError(); return; }
    rows.length = 0;
    SRC.applications.forEach(function (a) { var when = dateOf(a); rows.push({ a: a, when: when, p: when ? parts(when) : null, g: group(a) }); });
    render();
  }

  document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); }); });
  document.getElementById("f-year").addEventListener("change", function (e) { state.year = e.target.value; state.month = "all"; renderControls(); renderList(); });
  document.getElementById("f-month").addEventListener("change", function (e) { state.month = e.target.value; renderList(); });
  document.getElementById("f-sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
  document.getElementById("f-search").addEventListener("input", function (e) { state.q = e.target.value.trim(); renderList(); });
  document.getElementById("reset").addEventListener("click", function () {
    state = { year: "all", month: "all", group: "all", sort: "new", q: "" };
    document.getElementById("f-search").value = ""; renderControls(); renderList();
  });
  document.getElementById("expand").addEventListener("click", function () { document.querySelectorAll("#out details").forEach(function (d) { d.open = true; }); });
  document.getElementById("collapse").addEventListener("click", function () { document.querySelectorAll("#out details").forEach(function (d) { d.open = false; }); });
  document.getElementById("clear-sample").addEventListener("click", function () {
    try { localStorage.setItem(STORE, "1"); } catch (e) { /* private window: cleared for this view only */ }
    cleared = true; SRC = emptied(DATA);
    applyStatic(); renderFull();
  });
  var toTop = document.getElementById("to-top");
  window.addEventListener("scroll", function () { toTop.hidden = window.scrollY < 600; }, { passive: true });
  document.getElementById("theme-btn").addEventListener("click", function () {
    var root = document.documentElement; var dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
    try { localStorage.setItem("homensai.theme", dark ? "light" : "dark"); } catch (e) { /* not stored */ }
  });

  applyStatic();
  renderFull();
  if (DATA && !SRC) showError();
})();
</script>
