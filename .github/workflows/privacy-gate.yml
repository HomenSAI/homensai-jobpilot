# Release / personal-data gate: stops a publication when personal data, secrets or private folders are about to be published.
# GitHub automation only; it does not run on the user's computer and adds nothing to the user's package.
# © 2026 Serhii Khomenko / HomenS.AI · https://homensai.com/ · PolyForm Noncommercial 1.0.0
name: Privacy gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for personal data, secrets and private folders
        shell: bash
        run: |
          set -uo pipefail
          git config core.quotepath false
          fail=0
          problem() { echo "::error::$1"; fail=1; }

          # 1. Private folders and files must never be tracked (the person's data lives only on the person's computer).
          bad="$(git ls-files | grep -E '(^|/)(persons|journal|outbox|Applications|profiles)/|(^|/)workspace\.json$|(^|/)\.env|\.(pem|key|p12|pfx)$|(^|/)id_(rsa|ed25519)|(^|/)writer\.lock$|transactions-[0-9]{4}-[0-9]{2}.*\.jsonl$' || true)"
          if [ -n "$bad" ]; then problem "Private paths are tracked: $(printf '%s' "$bad" | tr '\n' ' ')"; fi

          # 2. The person's materials folder may contain only the README files and the questions file.
          bad="$(git ls-files 'Локальные_данные/Положите_сюда/*' | grep -vE '/(README\.md|Вопросы_для_рассказа\.md)$' || true)"
          if [ -n "$bad" ]; then problem "Personal materials are tracked: $(printf '%s' "$bad" | tr '\n' ' ')"; fi
          bad="$(git ls-files 'Локальные_данные/*' | grep -vE '^Локальные_данные/(Положите_сюда/|Resume/README\.md$|CoverLetter/README\.md$)' || true)"
          if [ -n "$bad" ]; then problem "Unexpected files under Локальные_данные: $(printf '%s' "$bad" | tr '\n' ' ')"; fi

          # 3. Secrets (only the file, the line and the kind are printed, never the value).
          check_pattern() { # $1 kind, $2 regex
            local hits
            hits="$(git ls-files -z -- ':!:.github/workflows/privacy-gate.yml' | xargs -0 grep -InE "$2" -- 2>/dev/null | cut -d: -f1,2 || true)"
            if [ -n "$hits" ]; then problem "$1 found at: $(printf '%s' "$hits" | tr '\n' ' ')"; fi
          }
          check_pattern 'GitHub token'        'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}'
          check_pattern 'AWS access key'      'AKIA[0-9A-Z]{16}'
          check_pattern 'API secret key'      'sk-[A-Za-z0-9]{20,}'
          check_pattern 'Private key'         '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          check_pattern 'Slack token'         'xox[baprs]-[A-Za-z0-9-]{10,}'
          check_pattern 'Google token or key' 'ya29\.[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}'

          # 4. E-mail addresses: only the author's, the project's, reserved example domains and the named placeholders.
          hits="$(git ls-files -z -- ':!:.github/workflows/privacy-gate.yml' | xargs -0 grep -IoHnE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' 2>/dev/null \
            | grep -vE '@(homensai\.com|example\.(com|org|net)|([a-z0-9-]+\.)+example|anthropic\.com|users\.noreply\.github\.com)$' \
            | grep -vE ':first\.last\.job@gmail\.com$' | cut -d: -f1,2 | sort -u || true)"
          if [ -n "$hits" ]; then problem "E-mail addresses outside the allowed list at: $(printf '%s' "$hits" | tr '\n' ' ')"; fi

          # 5. Paths of a real user's computer (the placeholders YourName, IhrName, ВашеИмя and ВашеІм’я are allowed).
          hits="$(git ls-files -z -- ':!:.github/workflows/privacy-gate.yml' | xargs -0 grep -InE 'C:\\Users\\[A-Za-z0-9_.-]+|/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/' 2>/dev/null \
            | grep -vE 'C:\\Users\\(YourName|IhrName|ВашеИмя|ВашеІм.{1,3}я)|/Users/YourName/|/home/YourName/' | cut -d: -f1,2 | sort -u || true)"
          if [ -n "$hits" ]; then problem "A path of a real computer found at: $(printf '%s' "$hits" | tr '\n' ' ')"; fi

          if [ "$fail" -ne 0 ]; then
            echo 'The privacy gate failed. Remove the data (and rotate any secret) before publishing.' >&2
            exit 1
          fi
          echo 'Privacy gate passed: no private folders, secrets, foreign e-mail addresses or personal paths are tracked.'
