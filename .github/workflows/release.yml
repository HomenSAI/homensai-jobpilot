# Synchronizes VERSION from the newest CHANGELOG section on every main push.
# GitHub release automation only; it does not run on the user's computer.
# © 2026 Serhii Khomenko / HomenS.AI · https://homensai.com/ · PolyForm Noncommercial 1.0.0
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes never run two releases at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    # The release waits for the privacy gate (.github/workflows/privacy-gate.yml).
    uses: ./.github/workflows/privacy-gate.yml
  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate the changelog version
        shell: bash
        run: |
          set -euo pipefail
          versions="$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ {print $2}' CHANGELOG.md)"
          v="$(printf '%s\n' "$versions" | head -n 1)"
          if ! printf '%s\n' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo 'CHANGELOG.md must start its release history with MAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          newest="$(printf '%s\n' "$versions" | sort -V | tail -n 1)"
          duplicates="$(printf '%s\n' "$versions" | sort | uniq -d)"
          if [ "$v" != "$newest" ] || [ -n "$duplicates" ]; then
            echo 'Release headings are duplicated or the newest version is not first.' >&2
            exit 1
          fi
          if [ -f VERSION ]; then
            current="$(tr -d '[:space:]' < VERSION)"
            if ! printf '%s\n' "$current" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo 'The existing VERSION is invalid; repair it explicitly.' >&2
              exit 1
            fi
            highest="$(printf '%s\n%s\n' "$current" "$v" | sort -V | tail -n 1)"
            if [ "$highest" != "$v" ]; then
              echo 'Refusing a VERSION downgrade.' >&2
              exit 1
            fi
          fi
          printf '%s\n' "$v" > VERSION_NEW
          printf 'VERSION=%s\n' "$v" >> "$GITHUB_ENV"
          for h in HISTORY.md docs/ru/HISTORY.md docs/de/HISTORY.md docs/uk/HISTORY.md; do
            first="$(awk -F ' [|] ' '/^- / { print substr($1, 3); exit }' "$h")"
            if [ "$first" != "$v" ]; then
              echo "::warning file=$h::The newest line of $h is $first, but the newest release is $v. Add a one-line summary for $v."
            fi
          done
      - name: Synchronize VERSION and the roadmap history on main
        shell: bash
        run: |
          set -euo pipefail
          mv VERSION_NEW VERSION
          gen_history() {
            # $1 history file (lines "- version | date | text"), $2 roadmap page: rewrites the block between the markers
            local history="$1" html="$2" list
            list="$(mktemp)"
            {
              printf '<ol class="history">\n'
              awk -F ' [|] ' '
                function esc(s) { gsub(/&/, "\\&amp;", s); gsub(/</, "\\&lt;", s); gsub(/>/, "\\&gt;", s); return s }
                /^- / {
                  v = substr($1, 3)
                  printf "<li><strong>%s</strong> · %s<br>%s</li>\n", esc(v), esc($2), esc($3)
                }
              ' "$history"
              printf '</ol>\n'
            } > "$list"
            awk -v listfile="$list" '
              /<!-- release-history:start -->/ { print; while ((getline line < listfile) > 0) print line; skip = 1; next }
              /<!-- release-history:end -->/ { skip = 0 }
              !skip { print }
            ' "$html" > "$html.new"
            mv "$html.new" "$html"
            rm -f "$list"
          }
          gen_history HISTORY.md overview_roadmap.html
          gen_history docs/ru/HISTORY.md docs/ru/overview_roadmap.html
          gen_history docs/de/HISTORY.md docs/de/overview_roadmap.html
          gen_history docs/uk/HISTORY.md docs/uk/overview_roadmap.html
          # Keep the version badge on every page equal to VERSION (see data-app-version in the HTML).
          while IFS= read -r page; do
            sed -i -E "s#(data-app-version[^>]*>)v[0-9]+\.[0-9]+\.[0-9]+<#\1v${VERSION}<#" "$page"
          done < <(grep -rl 'data-app-version' --include='*.html' . || true)
          git add -- VERSION overview_roadmap.html docs/ru/overview_roadmap.html docs/de/overview_roadmap.html docs/uk/overview_roadmap.html
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Version ${VERSION} (written from CHANGELOG.md; roadmap history updated)"
            # A normal push rejects a stale checkout; never force or overwrite newer work.
            git push origin HEAD:main
          fi
          printf 'RELEASE_TARGET_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create the release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its tag and assets."
            exit 0
          fi
          # An existing tag must target this immutable release commit; it is never moved.
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$tagged" != "$RELEASE_TARGET_SHA" ]; then
              echo 'The version tag already points to another commit; review or choose a new version.' >&2
              exit 1
            fi
          fi
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo 'See CHANGELOG.md' > notes.md; fi
          printf '\nFull history: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$tag" --target "$RELEASE_TARGET_SHA" --title "HomenS.AI JobPilot ${VERSION}" --notes-file notes.md
